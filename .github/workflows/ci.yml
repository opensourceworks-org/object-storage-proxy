name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings

  test_rust:
    name: Test (Rust)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: PyO3/maturin-action@v1
      - name: Run cargo tests
        env:
          AWS_LC_SYS_NO_ASM: "1"
        run: cargo test --all-features

  test_python:
    name: Test (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build and install extension
        uses: PyO3/maturin-action@v1
        env:
          AWS_LC_SYS_NO_ASM: "1"
        with:
          args: --out dist --find-interpreter
      - name: Install wheel and test deps
        run: |
          uv pip install --system dist/*.whl pytest
      - name: Run pytest
        run: pytest tests/


  linux:
    runs-on: ${{ matrix.platform.runner }}

    strategy:
      matrix:
        platform:
          # x86_64: standard hosted runner, native build
          - runner: ubuntu-22.04
            target: x86_64
          # aarch64: GitHub's native ARM runner — no cross-compilation, no stdatomic.h issues
          - runner: ubuntu-22.04-arm
            target: aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
          manylinux: auto
          before-script-linux: |
            # openssl-src's Configure requires IPC::Cmd which is missing from the manylinux image.
            yum install -y perl-IPC-Cmd || true

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    runs-on: ubuntu-22.04

    # Use Alpine so we can use apk directly
    container:
      image: alpine:3.18

    strategy:
      matrix:
        target: [ x86_64-unknown-linux-musl ]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apk update
          apk add --no-cache \
            bash \
            python3 \
            python3-dev \
            py3-pip \
            build-base \
            libffi-dev \
            pkgconfig \
            openssl-dev \
            curl \
            cmake \
            patchelf
          ln -s "$(which gcc)" /usr/bin/musl-gcc

          # sanity‐check it
          which musl-gcc
          musl-gcc --version

      - name: Install Rust toolchain
        env:
          HOME: /root      
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y

          source /root/.cargo/env
          rustup default stable
          rustup target add ${{ matrix.target }}   # install musl target

      - name: Install maturin
        env:
          HOME: /root    
        run: |
          source /root/.cargo/env
          cargo install maturin --locked --force

      - name: Build musllinux wheel
        env:
          HOME: /root
        run: |
          source /root/.cargo/env
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          export OPENSSL_STATIC=1
          python3 -m venv .venv
          source .venv/bin/activate
          pip install patchelf
          maturin build \
            --release \
            --manylinux musllinux_1_2 \
            --target ${{ matrix.target }} \
            --out dist

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-musllinux-${{ matrix.target }}
          path: dist
  

  # windows:
  #   runs-on: ${{ matrix.platform.runner }}
  #   strategy:
  #     matrix:
  #       platform:
  #         - runner: windows-latest
  #           target: x64

  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: 3.x
  #         architecture: ${{ matrix.platform.target }}
  #     - name: Build wheels
  #       uses: PyO3/maturin-action@v1
  #       with:
  #         target: ${{ matrix.platform.target }}
  #         args: --release --out dist --find-interpreter
  #         sccache: 'true'
  #     - name: Upload wheels
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: wheels-windows-${{ matrix.platform.target }}
  #         path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    # if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [lint, test_rust, test_python, linux, musllinux, macos, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'wheels-*/*'
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
